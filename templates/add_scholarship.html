```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Scholarship | University ERP</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .dashboard-container {
            max-width: 750px;
            margin: 40px auto;
            padding: 35px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        h1 {
            color: #172554;
            margin-bottom: 8px;
        }

        h2 {
            color: #334155;
            margin: 15px 0 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #334155;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe3ef;
            border-radius: 9px;
            background: #ffffff;
            color: #1e293b;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .dashboard-container {
                margin: 20px 12px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="dashboard-container">

    <h1>University ERP</h1>
    <h2>New Scholarship Application</h2>

    <p class="subtitle">
        Enter student details and scholarship information to submit an application.
    </p>

    <form method="POST">

        <label>Select Student</label>
        <select name="student_id" required>

            <option value="">Select Student</option>

            {% for student in students %}
            <option value="{{ student.student_id }}">
                {{ student.admission_no }} - {{ student.name }}
            </option>
            {% endfor %}

        </select>

        <label>Select Semester</label>
        <select name="semester_id" required>

            <option value="">Select Semester</option>

            {% for semester in semesters %}
            <option value="{{ semester.semester_id }}">
                Semester {{ semester.semester_number }} - {{ semester.academic_year }}
            </option>
            {% endfor %}

        </select>

        <label>Scholarship Name</label>
        <select name="scholarship_name" required>

            <option value="">Select Scholarship</option>
            <option value="Merit Scholarship">Merit Scholarship</option>
            <option value="Government Scholarship">Government Scholarship</option>
            <option value="Sports Scholarship">Sports Scholarship</option>
            <option value="Need Based Scholarship">Need Based Scholarship</option>
            <option value="Other">Other</option>

        </select>

        <label>Scholarship Amount (₹)</label>
        <input
            type="number"
            name="amount"
            min="1"
            step="0.01"
            placeholder="Enter scholarship amount"
            required
        >

        <button type="submit">Submit Application</button>

    </form>

    <a href="/manage_scholarships" class="back-link">
        ← Back to Scholarships
    </a>

</div>

</body>
</html>
```
