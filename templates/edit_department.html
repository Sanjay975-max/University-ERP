```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Department - University ERP</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 18px;
            min-height: 100vh;
            background: #f3f6fc;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #17233c;
        }

        .department-wrapper {
            max-width: 850px;
            margin: 0 auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #304caa;
            color: white;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 700;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 750;
            color: #1c2d55;
        }

        .brand-subtitle {
            font-size: 12px;
            color: #8994a8;
            margin-top: 3px;
        }

        .page-title {
            font-size: 28px;
            color: #172b52;
            margin-bottom: 8px;
        }

        .page-description {
            color: #7d899e;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-card {
            background: white;
            border: 1px solid #e5eaf3;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(30, 50, 90, 0.05);
        }

        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: #263b68;
            margin-bottom: 7px;
        }

        .section-description {
            color: #8994a8;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .department-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 650;
            color: #354563;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #dce3ef;
            border-radius: 9px;
            background: #fbfcff;
            color: #273750;
            font-size: 14px;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            border-color: #536fe0;
            background: white;
            box-shadow: 0 0 0 3px rgba(83, 111, 224, 0.12);
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 13px;
            margin-top: 8px;
            padding-top: 22px;
            border-top: 1px solid #edf0f5;
        }

        .submit-button {
            min-width: 190px;
            height: 46px;
            padding: 0 18px;
            border: none;
            border-radius: 9px;
            background: #304caa;
            color: white;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .submit-button:hover {
            background: #243d91;
            transform: translateY(-1px);
        }

        .back-link {
            display: inline-block;
            padding: 13px 15px;
            color: #53637e;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.2s ease;
        }

        .back-link:hover {
            background: #f1f4fa;
            color: #304caa;
        }

        .footer-note {
            margin-top: 22px;
            text-align: center;
            color: #9aa4b5;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 22px 12px;
            }

            .form-card {
                padding: 22px 17px;
            }

            .department-form {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .page-title {
                font-size: 24px;
            }

            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .submit-button {
                width: 100%;
            }

            .back-link {
                text-align: center;
            }
        }
    </style>

</head>

<body>

<div class="department-wrapper">

    <div class="brand">

        <div class="brand-icon">U</div>

        <div>
            <div class="brand-name">University ERP</div>
            <div class="brand-subtitle">University Management System</div>
        </div>

    </div>

    <h1 class="page-title">Edit Department</h1>

    <p class="page-description">
        Update the academic department information below.
    </p>

    <div class="form-card">

        <h2 class="section-title">Department Information</h2>

        <p class="section-description">
            Modify the department details and save your changes.
        </p>

        <form method="POST" class="department-form">

            <div class="form-group">

                <label>Department Name</label>

                <input
                    type="text"
                    name="department_name"
                    value="{{ department.department_name }}"
                    required
                >

            </div>

            <div class="form-group">

                <label>Department Code</label>

                <input
                    type="text"
                    name="department_code"
                    value="{{ department.department_code }}"
                    required
                >

            </div>

            <div class="form-group full-width">

                <label>Office Location</label>

                <input
                    type="text"
                    name="office_location"
                    value="{{ department.office_location or '' }}"
                >

            </div>

            <div class="form-actions">

                <button type="submit" class="submit-button">
                    Update Department
                </button>

                <a href="/manage_departments" class="back-link">
                    Back to Departments
                </a>

            </div>

        </form>

    </div>

    <div class="footer-note">
        University ERP Management System
    </div>

</div>

</body>
</html>
```
