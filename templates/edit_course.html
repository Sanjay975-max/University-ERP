<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Course | University ERP</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .course-page {
            max-width: 800px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .course-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #e5eaf2;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.07);
        }

        .course-header {
            margin-bottom: 25px;
        }

        .course-header h1 {
            color: #172554;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .course-header p {
            color: #64748b;
            font-size: 14px;
        }

        .course-form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .course-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .course-field.full-width {
            grid-column: 1 / -1;
        }

        .course-field label {
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .course-field input,
        .course-field select,
        .course-field textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            color: #1e293b;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }

        .course-field textarea {
            min-height: 120px;
            resize: vertical;
        }

        .course-field input:focus,
        .course-field select:focus,
        .course-field textarea:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .course-submit {
            margin-top: 25px;
            padding: 13px 24px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .course-submit:hover {
            background: #3730a3;
        }

        .course-back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #4338ca;
            font-size: 14px;
            font-weight: 600;
        }

        .course-back:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .course-card {
                padding: 22px;
            }

            .course-form-grid {
                grid-template-columns: 1fr;
            }

            .course-field.full-width {
                grid-column: auto;
            }

            .course-header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="course-page">

    <div class="course-card">

        <div class="course-header">
            <h1>Edit Course</h1>
            <p>Update the course information below.</p>
        </div>

        <form method="POST" action="/edit_course/{{ course.course_id }}">

            <div class="course-form-grid">

                <div class="course-field">
                    <label>Course Code</label>
                    <input type="text"
                           name="course_code"
                           value="{{ course.course_code }}"
                           required>
                </div>

                <div class="course-field">
                    <label>Course Name</label>
                    <input type="text"
                           name="course_name"
                           value="{{ course.course_name }}"
                           required>
                </div>

                <div class="course-field">
                    <label>Department</label>
                    <select name="department_id" required>

                        {% for department in departments %}
                        <option value="{{ department.department_id }}"
                            {% if department.department_id == course.department_id %}
                                selected
                            {% endif %}>
                            {{ department.department_name }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="course-field">
                    <label>Credits</label>
                    <input type="number"
                           name="credits"
                           value="{{ course.credits }}"
                           min="1"
                           required>
                </div>

                <div class="course-field full-width">
                    <label>Description</label>
                    <textarea name="description">{{ course.description or '' }}</textarea>
                </div>

            </div>

            <button type="submit" class="course-submit">
                Update Course
            </button>

        </form>

        <a href="/manage_courses" class="course-back">
            ← Back to Courses
        </a>

    </div>

</div>

</body>
</html>
