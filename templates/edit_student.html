
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - University ERP</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>University ERP</h1>
        <h2>Edit Student Details</h2>

        <form method="POST">

            <div>
                <label>Admission Number</label>
                <input type="text" name="admission_no"
                       value="{{ student.admission_no }}" required>
            </div>

            <div>
                <label>Student Name</label>
                <input type="text" name="name"
                       value="{{ student.name }}" required>
            </div>

            <div>
                <label>Email</label>
                <input type="email" name="email"
                       value="{{ student.email }}" required>
            </div>

            <div>
                <label>Phone</label>
                <input type="text" name="phone"
                       value="{{ student.phone }}" required>
            </div>

            <div>
                <label>Gender</label>
                <select name="gender" required>
                    <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div>
                <label>Date of Birth</label>
                <input type="date" name="date_of_birth"
                       value="{{ student.date_of_birth }}" required>
            </div>

            <div>
                <label>Admission Date</label>
                <input type="date" name="admission_date"
                       value="{{ student.admission_date }}" required>
            </div>

            <div>
                <label>Department ID</label>
                <input type="number" name="department_id"
                       value="{{ student.department_id }}" required>
            </div>

            <div>
                <label>Current Semester</label>
                <input type="number" name="current_semester"
                       value="{{ student.current_semester }}" required>
            </div>

            <div>
                <label>Status</label>
                <select name="status" required>
                    <option value="Active" {% if student.status == 'Active' %}selected{% endif %}>Active</option>
                    <option value="Inactive" {% if student.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>

            <button type="submit">Update Student</button>

        </form>

        <div style="text-align: center; margin-top: 25px;">
            <a href="/manage_students">Back to Student Management</a>
        </div>

    </div>

</body>
</html>
