<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University ERP Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f0fdfa;
        }
        .login-box {
            width: 90%;
            max-width: 390px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 30px #00000015;
        }
        h2 { color: #0f766e; text-align: center; }
        p { color: #64748b; text-align: center; }
        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: 0;
            border-radius: 7px;
            background: #0f766e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .error { color: #dc2626; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>University ERP</h2>
        <p>Sign in to continue</p>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
