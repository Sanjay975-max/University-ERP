```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student Result | University ERP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .result-form-container {
            max-width: 750px;
            margin: 40px auto;
            padding: 35px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
        }

        .result-form-container h1 {
            color: #172554;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .form-subtitle {
            color: #64748b;
            margin-bottom: 28px;
        }

        .result-form-container label {
            display: block;
            margin: 20px 0 8px;
            color: #334155;
            font-weight: 600;
        }

        .result-form-container input,
        .result-form-container select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #f8fafc;
            font-size: 15px;
            outline: none;
        }

        .result-form-container input:focus,
        .result-form-container select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .result-form-container button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .result-form-container button:hover {
            background: #3730a3;
        }

        .result-navigation {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .result-navigation a {
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            background: #eef2ff;
            color: #4338ca;
            font-weight: 600;
        }

        .result-navigation a:hover {
            background: #e0e7ff;
        }

        .error-message {
            padding: 12px 15px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .result-form-container {
                margin: 20px 10px;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="result-form-container">

    <h1>Add Student Result</h1>
    <p class="form-subtitle">
        Enter examination details and student marks below.
    </p>

    <div class="result-navigation">
        <a href="/manage_results">View All Results</a>
        <a href="/admin">Admin Dashboard</a>
    </div>

    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label for="exam_id">Select Exam</label>
        <select name="exam_id" id="exam_id" required>
            <option value="">Choose Exam</option>
            {% for exam in exams %}
                <option value="{{ exam.exam_id }}">
                    {{ exam.exam_name }} - Maximum Marks: {{ exam.max_marks }}
                </option>
            {% endfor %}
        </select>

        <label for="enrollment_id">Select Student</label>
        <select name="enrollment_id" id="enrollment_id" required>
            <option value="">Choose Student</option>
            {% for enrollment in enrollments %}
                <option value="{{ enrollment.enrollment_id }}">
                    {{ enrollment.name }} -
                    {{ enrollment.admission_no }} -
                    {{ enrollment.course_name }}
                </option>
            {% endfor %}
        </select>

        <label for="marks_obtained">Marks Obtained</label>
        <input
            type="number"
            name="marks_obtained"
            id="marks_obtained"
            step="0.01"
            min="0"
            placeholder="Enter marks obtained"
            required
        >

        <button type="submit">Save Result</button>

    </form>

</div>

</body>
</html>
