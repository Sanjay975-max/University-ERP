```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Placement | University ERP</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .placement-form-container {
            max-width: 750px;
            margin: 30px auto;
            padding: 35px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.06);
        }

        .placement-form-header {
            margin-bottom: 28px;
        }

        .placement-form-header h2 {
            color: #172554;
            margin-bottom: 8px;
        }

        .placement-form-header p {
            color: #64748b;
            font-size: 14px;
        }

        .placement-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .placement-form label {
            color: #334155;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
        }

        .placement-form input,
        .placement-form select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #ffffff;
            color: #334155;
            font-size: 14px;
            outline: none;
            transition: 0.2s ease;
        }

        .placement-form input:focus,
        .placement-form select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.10);
        }

        .placement-form button {
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .placement-form button:hover {
            background: #4338ca;
        }

        .back-placement-link {
            display: inline-block;
            margin-top: 22px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-placement-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .placement-form-container {
                margin: 15px auto;
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="dashboard-container">

    <div class="placement-form-container">

        <div class="placement-form-header">
            <h1>University ERP</h1>
            <h2>Add New Placement Record</h2>
            <p>Enter student placement details in the form below.</p>
        </div>

        <form method="POST" class="placement-form">

            <label>Select Student:</label>

            <select name="student_id" required>
                <option value="">Select Student</option>

                {% for student in students %}
                <option value="{{ student.student_id }}">
                    {{ student.admission_no }} - {{ student.name }}
                </option>
                {% endfor %}

            </select>

            <label>Company Name:</label>

            <input
                type="text"
                name="company_name"
                placeholder="Enter company name"
                required
            >

            <label>Job Role:</label>

            <input
                type="text"
                name="job_role"
                placeholder="e.g. Software Developer"
            >

            <label>Package (LPA):</label>

            <input
                type="number"
                name="package_lpa"
                min="0.01"
                step="0.01"
                placeholder="e.g. 6.50"
            >

            <label>Placement Date:</label>

            <input
                type="date"
                name="placement_date"
            >

            <label>Placement Status:</label>

            <select name="placement_status" required>
                <option value="Applied">Applied</option>
                <option value="Shortlisted">Shortlisted</option>
                <option value="Interview">Interview</option>
                <option value="Selected">Selected</option>
                <option value="Joined">Joined</option>
                <option value="Rejected">Rejected</option>
            </select>

            <button type="submit">
                Save Placement Record
            </button>

        </form>

        <a href="/manage_placements" class="back-placement-link">
            ← Back to Placements
        </a>

    </div>

</div>

</body>
</html>
```
